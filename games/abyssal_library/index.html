<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊图书馆 - The Abyssal Library</title>
<style>
:root {
  --bg: #1a1a2e;
  --panel: #16213e;
  --text: #e0d5c1;
  --gold: #c9a96e;
  --red: #8b3a3a;
  --blue: #4a7c96;
  --green: #5a8a6a;
  --dark: #0f0f1a;
  --border: #2a2a4a;
  --highlight: #f0d78c;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Georgia', 'Noto Serif SC', serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-image: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 100%);
}

#game-container {
  width: 100%;
  max-width: 780px;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* 标题栏 */
#title-bar {
  text-align: center;
  padding: 30px 20px 15px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 15px;
}
#title-bar h1 {
  font-size: 2em;
  color: var(--gold);
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px rgba(201,169,110,0.3);
  margin-bottom: 5px;
}
#title-bar .subtitle {
  font-size: 0.85em;
  color: #6a6a8a;
  font-style: italic;
}

/* 属性面板 */
#stats-panel {
  display: flex;
  justify-content: space-around;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 15px;
  margin-bottom: 18px;
  gap: 10px;
}
.stat {
  text-align: center;
  flex: 1;
}
.stat-icon { font-size: 1.3em; }
.stat-label { font-size: 0.7em; color: #8a8a9a; text-transform: uppercase; letter-spacing: 0.1em; }
.stat-value { font-size: 1.4em; font-weight: bold; color: var(--highlight); }
.stat-bar {
  height: 4px;
  background: var(--dark);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.stat-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}
#sanity-bar .stat-bar-fill { background: linear-gradient(90deg, #8b3a3a, #c96a5a); }
#knowledge-bar .stat-bar-fill { background: linear-gradient(90deg, #4a7c96, #6ab8d6); }
#bookmark-bar .stat-bar-fill { background: linear-gradient(90deg, #5a8a6a, #8aca8a); }

/* 故事面板 */
#story-panel {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 25px 28px;
  margin-bottom: 18px;
  line-height: 1.85;
  font-size: 1.05em;
  min-height: 220px;
  position: relative;
  overflow-y: auto;
  max-height: 420px;
}
#story-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to bottom, var(--panel), transparent);
  border-radius: 8px 8px 0 0;
  pointer-events: none;
  z-index: 1;
}
#scene-title {
  color: var(--gold);
  font-size: 1.3em;
  margin-bottom: 12px;
  text-align: center;
  letter-spacing: 0.05em;
}
#narrative {
  color: var(--text);
  white-space: pre-wrap;
}
.effect-text {
  color: #8a8a9a;
  font-style: italic;
  font-size: 0.9em;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dotted var(--border);
}

/* 选择面板 */
#choices-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
.choice-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 20px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.choice-btn:hover {
  border-color: var(--gold);
  color: var(--highlight);
  background: #1e2a40;
  transform: translateX(4px);
  box-shadow: 0 0 15px rgba(201,169,110,0.1);
}
.choice-btn:active {
  transform: scale(0.98);
}
.choice-btn .choice-hint {
  display: block;
  font-size: 0.75em;
  color: #6a6a8a;
  margin-top: 3px;
  font-style: italic;
}

/* 日志区 */
#log-panel {
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 15px;
  margin-bottom: 15px;
  max-height: 100px;
  overflow-y: auto;
  font-size: 0.78em;
  color: #6a6a8a;
}
#log-panel .log-entry {
  padding: 2px 0;
  border-bottom: 1px solid #1a1a2a;
}
#log-panel .log-entry:last-child { border-bottom: none; }

/* 底部 */
#footer-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 0.75em;
  color: #4a4a6a;
}
#footer-bar button {
  background: transparent;
  border: 1px solid #3a3a5a;
  color: #6a6a8a;
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  transition: all 0.2s;
}
#footer-bar button:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* 结局画面 */
#ending-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
#ending-overlay.active { display: flex; }
#ending-card {
  background: var(--panel);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 40px;
  max-width: 550px;
  text-align: center;
  box-shadow: 0 0 60px rgba(201,169,110,0.2);
}
#ending-card h2 {
  color: var(--gold);
  font-size: 2em;
  margin-bottom: 15px;
  letter-spacing: 0.1em;
}
#ending-card .ending-type {
  color: #8a8a9a;
  font-size: 0.85em;
  margin-bottom: 15px;
}
#ending-card p {
  line-height: 1.8;
  margin-bottom: 20px;
}
#ending-card button {
  background: var(--gold);
  color: var(--dark);
  border: none;
  padding: 12px 30px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: bold;
}
#ending-card button:hover {
  background: var(--highlight);
  box-shadow: 0 0 20px rgba(201,169,110,0.4);
}

/* 响应式 */
@media (max-width: 600px) {
  #title-bar h1 { font-size: 1.4em; }
  #story-panel { padding: 18px; font-size: 0.95em; max-height: 300px; }
  .choice-btn { padding: 12px 15px; font-size: 0.9em; }
  #ending-card { padding: 25px; }
}
</style>
</head>
<body>

<div id="game-container">
  <div id="title-bar">
    <h1>📚 深渊图书馆</h1>
    <div class="subtitle">The Abyssal Library — 一部交互式文字冒险</div>
  </div>

  <div id="stats-panel">
    <div class="stat" id="sanity-stat">
      <div class="stat-icon">🧠</div>
      <div class="stat-label">理智</div>
      <div class="stat-value" id="sanity-val">100</div>
      <div class="stat-bar" id="sanity-bar"><div class="stat-bar-fill" style="width:100%"></div></div>
    </div>
    <div class="stat" id="knowledge-stat">
      <div class="stat-icon">📖</div>
      <div class="stat-label">知识</div>
      <div class="stat-value" id="knowledge-val">0</div>
      <div class="stat-bar" id="knowledge-bar"><div class="stat-bar-fill" style="width:0%"></div></div>
    </div>
    <div class="stat" id="bookmark-stat">
      <div class="stat-icon">🔖</div>
      <div class="stat-label">书签</div>
      <div class="stat-value" id="bookmark-val">0</div>
      <div class="stat-bar" id="bookmark-bar"><div class="stat-bar-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="story-panel">
    <div id="scene-title"></div>
    <div id="narrative"></div>
  </div>

  <div id="choices-panel"></div>

  <div id="log-panel"></div>

  <div id="footer-bar">
    <span>场景: <span id="scene-counter">1</span> | 步数: <span id="step-counter">0</span></span>
    <button onclick="restartGame()">🔄 重新开始</button>
  </div>
</div>

<div id="ending-overlay">
  <div id="ending-card">
    <h2 id="ending-title"></h2>
    <div class="ending-type" id="ending-type"></div>
    <p id="ending-description"></p>
    <p style="font-size:0.85em;color:#6a6a8a;" id="ending-stats"></p>
    <button onclick="restartGame()">🔄 再次进入图书馆</button>
  </div>
</div>

<script>
// ============================================================
// 深渊图书馆 — 游戏引擎
// ============================================================

const player = {
  sanity: 100,
  knowledge: 0,
  bookmarks: 0,
  visitedScenes: new Set(),
  flags: {},
  stepCount: 0,
  sceneCount: 0
};

const SCENES = {};
const ENDINGS = {};
let currentSceneId = 'entrance';

// --- 工具函数 ---
function r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function addLog(msg) {
  const lp = document.getElementById('log-panel');
  lp.innerHTML += `<div class="log-entry">📜 ${msg}</div>`;
  lp.scrollTop = lp.scrollHeight;
}

// --- 属性修改 ---
function modSanity(delta) {
  const prev = player.sanity;
  player.sanity = clamp(player.sanity + delta, 0, 100);
  updateStats();
  if (delta < -5) addLog(`理智 ${delta} — 你感到一阵眩晕...`);
  if (delta > 5) addLog(`理智 +${delta} — 你重新找回了镇定。`);
  if (player.sanity <= 0 && prev > 0) {
    setTimeout(() => triggerEnding('mad_scholar'), 800);
  }
}
function modKnowledge(delta) {
  player.knowledge = clamp(player.knowledge + delta, 0, 100);
  updateStats();
  if (delta > 5) addLog(`知识 +${delta} — 新的认知在脑海中浮现。`);
}
function modBookmarks(delta) {
  player.bookmarks = Math.max(0, player.bookmarks + delta);
  updateStats();
  if (delta > 0) addLog(`🔖 获得书签！当前: ${player.bookmarks}`);
}

// --- 标记 ---
function setFlag(f) { player.flags[f] = true; }
function hasFlag(f) { return player.flags[f] === true; }
function visited(sceneId) { return player.visitedScenes.has(sceneId); }

// --- UI 更新 ---
function updateStats() {
  document.getElementById('sanity-val').textContent = player.sanity;
  document.getElementById('knowledge-val').textContent = player.knowledge;
  document.getElementById('bookmark-val').textContent = player.bookmarks;
  document.getElementById('sanity-bar').querySelector('.stat-bar-fill').style.width = player.sanity + '%';
  document.getElementById('knowledge-bar').querySelector('.stat-bar-fill').style.width = player.knowledge + '%';
  document.getElementById('bookmark-bar').querySelector('.stat-bar-fill').style.width = (player.bookmarks * 10) + '%';
  document.getElementById('step-counter').textContent = player.stepCount;
  document.getElementById('scene-counter').textContent = player.sceneCount;
}

function renderScene(scene) {
  document.getElementById('scene-title').textContent = scene.title;
  let narrative = scene.text;
  
  // 处理条件文本
  if (scene.condText) {
    for (const [flag, txt] of Object.entries(scene.condText)) {
      if (hasFlag(flag)) narrative += '\n\n' + txt;
    }
  }
  
  document.getElementById('narrative').innerHTML = narrative.replace(/\n/g, '<br>');
  
  const cp = document.getElementById('choices-panel');
  cp.innerHTML = '';
  
  let choices = scene.choices.filter(c => {
    if (c.requireFlag && !hasFlag(c.requireFlag)) return false;
    if (c.requireMinSanity && player.sanity < c.requireMinSanity) return false;
    if (c.requireMinKnowledge && player.knowledge < c.requireMinKnowledge) return false;
    if (c.requireMinBookmarks && player.bookmarks < c.requireMinBookmarks) return false;
    if (c.requireMaxSanity && player.sanity > c.requireMaxSanity) return false;
    return true;
  });
  
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.label + (c.hint ? `<span class="choice-hint">${c.hint}</span>` : '');
    btn.addEventListener('click', () => {
      player.stepCount++;
      if (c.effects) c.effects();
      if (c.setFlag) setFlag(c.setFlag);
      if (c.nextScene) {
        navigateTo(c.nextScene);
      } else if (c.ending) {
        triggerEnding(c.ending);
      }
    });
    cp.appendChild(btn);
  });
  
  if (choices.length === 0) {
    cp.innerHTML = '<div style="color:#8a8a9a;text-align:center;padding:20px;">前方无路可走...图书馆将你吞噬。</div>';
    setTimeout(() => triggerEnding('lost'), 2000);
  }
  
  updateStats();
}

function navigateTo(sceneId) {
  player.visitedScenes.add(sceneId);
  player.sceneCount++;
  currentSceneId = sceneId;
  renderScene(SCENES[sceneId]);
}

function triggerEnding(endingId) {
  const e = ENDINGS[endingId];
  if (!e) return;
  document.getElementById('ending-title').textContent = e.title;
  document.getElementById('ending-type').textContent = e.type;
  document.getElementById('ending-description').textContent = e.text;
  document.getElementById('ending-stats').textContent = 
    `理智: ${player.sanity} | 知识: ${player.knowledge} | 书签: ${player.bookmarks} | 步数: ${player.stepCount} | 场景: ${player.sceneCount}`;
  document.getElementById('ending-overlay').classList.add('active');
  addLog(`🎭 结局: ${e.title}`);
}

function restartGame() {
  player.sanity = 100;
  player.knowledge = 0;
  player.bookmarks = 0;
  player.visitedScenes = new Set();
  player.flags = {};
  player.stepCount = 0;
  player.sceneCount = 0;
  document.getElementById('ending-overlay').classList.remove('active');
  document.getElementById('log-panel').innerHTML = '';
  currentSceneId = 'entrance';
  navigateTo('entrance');
  addLog('📚 你再次踏入深渊图书馆...');
}

// ============================================================
// 场景定义
// ============================================================

SCENES.entrance = {
  title: '📯 入口大厅',
  text: '你推开沉重的橡木大门，踏入这座传说中的"深渊图书馆"。\n\n高耸的穹顶消失在黑暗之中，烛台发出微弱的暖黄色光芒，照亮了无穷无尽的书架——它们向四面八方延伸，仿佛没有尽头。空气中弥漫着旧书页和皮革封面的气味。\n\n你是一名学者。多年来，你追寻着关于这座图书馆的传说：它收藏了世间一切知识，却也囚禁了所有试图窥探其秘密的人。\n\n正前方是一扇巨大的彩绘玻璃窗，描绘着一棵根系深扎于黑暗中的知识之树。左手边是通往"哲学区"的拱门，右手边的走廊通向"星图室"。一道螺旋楼梯向下延伸，通往未知的深处。\n\n你深吸一口气。知识的诱惑与未知的恐惧在心中交织。',
  choices: [
    {
      label: '📖 走向哲学区——古老的智慧在召唤',
      hint: '知识+10',
      effects: () => { modKnowledge(10); },
      nextScene: 'philosophy'
    },
    {
      label: '⭐ 前往星图室——探索宇宙的奥秘',
      hint: '知识+5，理智-5',
      effects: () => { modKnowledge(5); modSanity(-5); },
      nextScene: 'star_chart'
    },
    {
      label: '🌀 沿螺旋楼梯向下——追寻更深层的秘密',
      hint: '理智-10',
      effects: () => { modSanity(-10); },
      nextScene: 'spiral_staircase'
    },
    {
      label: '🔍 仔细检查入口大厅——也许有隐藏的线索',
      hint: '可能找到书签',
      effects: () => {
        if (!hasFlag('found_entrance_bookmark')) {
          setFlag('found_entrance_bookmark');
          modBookmarks(1);
          addLog('你在彩绘玻璃窗下的石板缝隙中发现了一枚古老的铜质书签。');
        } else {
          addLog('你已经仔细检查过这里了。');
        }
      },
      nextScene: 'entrance'
    }
  ]
};

SCENES.philosophy = {
  title: '📜 哲学区',
  text: '哲学区的书架由深色橡木制成，每一本书的脊背都烙印着金色的符号。这里收藏着从古至今所有哲学家的著作——苏格拉底、庄子、尼采、还有你从未听说过的名字。\n\n空气中弥漫着一种沉静的智慧。但在书架深处，你注意到一个被锁链缠绕的阅览台，上面摊开着一本散发着微弱蓝光的书。锁链上刻着警告："真理之重，非心灵薄弱者可承。"',
  choices: [
    {
      label: '📗 阅读一本柏拉图的著作——寻求理性的慰藉',
      hint: '知识+15，理智+10',
      effects: () => { modKnowledge(15); modSanity(10); },
      nextScene: 'philosophy_after'
    },
    {
      label: '🔮 尝试阅读被锁链束缚的"真理之书"',
      hint: '知识+25，理智-20（需要理智≥30）',
      requireMinSanity: 30,
      effects: () => { modKnowledge(25); modSanity(-20); setFlag('read_truth_book'); },
      nextScene: 'philosophy_after'
    },
    {
      label: '🚶 回到入口大厅',
      effects: () => {},
      nextScene: 'entrance'
    }
  ]
};

SCENES.philosophy_after = {
  title: '📜 哲学区·深处',
  text: hasFlag('read_truth_book')
    ? '真理之书的内容在你脑海中燃烧。你读到了关于"图书馆本质"的片段——它不是一个地方，而是一种存在状态。所有知识同时存在于此，过去、现在、未来交织在一起。你感到自己的意识被拉伸到了极限，但同时也获得了前所未有的洞察。\n\n在书架尽头，你注意到一道暗门，上面刻着"索引大厅"。'
    : '翻阅完经典著作后，你感到心境平和。哲学区的灯光似乎比刚才更亮了一些。你在书架间漫步时，发现了一扇隐藏的暗门，上面刻着"索引大厅"。',
  choices: [
    {
      label: '🚪 进入索引大厅',
      effects: () => {},
      nextScene: 'index_hall'
    },
    {
      label: '🚶 返回入口大厅',
      effects: () => {},
      nextScene: 'entrance'
    }
  ]
};

SCENES.star_chart = {
  title: '🌌 星图室',
  text: '星图室是一个巨大的圆形房间，穹顶上镶嵌着数以万计的发光晶体，模拟着某种未知的星空。墙壁上挂满了星图——不是地球上的星座，而是你从未见过的天体排列。\n\n房间中央有一座黄铜制的地球仪大小的天体模型，缓缓旋转着。走近细看，你发现那不是模型，而是一个微缩的、正在实时演化的宇宙。\n\n一位身着深蓝长袍的老者坐在角落里，正在用羽毛笔绘制星图。他抬起头，用深邃的目光看着你。"又一位追寻者，"他说，"你看得见宇宙的真相吗？"',
  choices: [
    {
      label: '🌠 与老者交谈，请求他解读星图',
      hint: '知识+10，获得书签',
      effects: () => {
        modKnowledge(10);
        if (!hasFlag('astronomer_bookmark')) {
          setFlag('astronomer_bookmark');
          modBookmarks(1);
        }
        setFlag('talked_to_astronomer');
      },
      nextScene: 'star_chart_talk'
    },
    {
      label: '🔭 自行研究微缩宇宙模型',
      hint: '知识+15，理智-10',
      effects: () => { modKnowledge(15); modSanity(-10); setFlag('studied_cosmos'); },
      nextScene: 'star_chart_after'
    },
    {
      label: '🚶 返回入口大厅',
      effects: () => {},
      nextScene: 'entrance'
    }
  ]
};
