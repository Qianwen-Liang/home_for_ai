name: CI

# 治理门禁流水线（T2798 / 方案③）
# 目标：把"人记得跑 gate.py"变成"机器必须跑，红了不许合入"。
#
# 门禁内容见 scripts/gate.py：
#   G1 数据隔离 —— 测试不得改写生产数据（knowledge/ memory/ 运行时文件）
#   G2 确定性   —— ID 唯一 / 并发不丢数据 / 幂等 / 失败可判定
#   G3 契约漂移 —— known_issues 未关闭或虚假关闭即红
#   G4 性能回归 —— 核心路径 p50 退化 > 20% 即红

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 治理门禁 G1-G4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        # 刻意不安装 sentence-transformers / torch：
        # 语义检索为可选能力，带惰性降级；CI 只需验证确定性与契约。
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: 运行治理门禁
        run: python scripts/gate.py

      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            eval/governance/*.json
          if-no-files-found: ignore
          retention-days: 14

  tests:
    name: 全量单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema hypothesis

      - name: 运行测试（带完整性审计）
        # test_audit.py 会校验"收集数/通过数/跳过数"阈值，防止
        # "因为没跑所以通过"的假绿——这曾是本 CI 首次全绿时的真实疑点
        # （600 个用例只用 18 秒，本地需 70 秒）。
        # 已知失败从 eval/governance/known_test_failures.json 读取，
        # 保证"CI 排除的"与"正式登记的"永远是同一份清单。
        run: python scripts/test_audit.py

      - name: 已知失败项提醒
        if: always()
        run: |
          echo "::warning title=已知失败::F1/F2 (test_debugger.py) 状态=accepted，详见 eval/governance/known_test_failures.json。出口条件：补齐网络/认证故障的自动修复规则并改用确定性样本断言。"
