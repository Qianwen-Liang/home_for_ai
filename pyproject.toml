[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-sandbox"
version = "4.1.0"
description = "Agent 1 智能体系统 — 多智能体协同、工具生态、进化引擎"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # 契约测试网依赖（tests/contract/）：schema 校验 + 属性测试
    "jsonschema>=4.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evolver*", "tools*", "memory*", "knowledge*", "tests*"]
exclude = ["__pycache__*", ".*"]

[tool.setuptools]
py-modules = []
